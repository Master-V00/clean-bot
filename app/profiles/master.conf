[General]

# Server Profile for Discord Bot Integration
notes = Server Profile for Discord Bot Integration

# Preferred file type to save the cleaned image as.
preferred_file_type = .png

# Enable full LaMa Inpainting without pre-filling the mask with binary colors
full_lama_inpainting = true

# Preferred file type to save the mask as.
preferred_mask_file_type = .png

# Combine outputs into a single project file as layers.
layered_export = none

# Input height targets for scaling during processing.
input_height_lower_target = 1000
input_height_upper_target = 4000

# Split long strips into individual pages.
split_long_strips = True
preferred_split_height = 2000
split_tolerance_margin = 500
long_strip_aspect_ratio = 0.33
merge_after_split = True

# Maximum number of threads for exporting images. 0 = auto (use all cores, e.g. 20)
max_threads_export = 0


[TextDetector]

# Text detection model: hi-sam (pixel-level masks, best for manga)
# vit_h = 632M, أدق لكن يستهلك VRAM ~6GB، مع 34 part قد يسبب OOM على 11GB
# vit_b = 91M أسرع وأخف لكن checkpoints قد تكون ناقصة على السيرفر حالياً → نبقي vit_h مع معالجة OOM
text_detector_model = hi-sam
hi_sam_model_type = vit_h
hi_sam_checkpoint_dir = 

# Path to the text detection model (leave empty for built-in)
model_path = 

# Number of models to run in parallel.
# Use 1 model per 2 GB of memory available.
concurrent_models = 8


[Preprocessor]

# Minimum size of any box to keep.
box_min_size = 400

# Reading order for text detection
reading_order = auto

# Minimum size of a box with "unknown" language to keep.
suspicious_box_min_size = 40000

# Minimum overlap between two boxes to merge (0-100%).
box_overlap_threshold = 20.0

# Padding for boxes
box_padding_initial = 2
box_right_padding_initial = 3
box_padding_extended = 5
box_right_padding_extended = 5
box_reference_padding = 20


[Masker]

# Maximum threads for mask generation (0 = auto = all cores)
max_threads = 0

# Number of pixels to grow the mask by each step.
mask_growth_step_pixels = 2

# Number of steps to grow the mask by.
mask_growth_steps = 11

# Minimum thickness of a mask.
min_mask_thickness = 2

# Allow colored masks
allow_colored_masks = True

# Off-white threshold
off_white_max_threshold = 240

# Mask quality thresholds
mask_max_standard_deviation = 15.0
mask_improvement_threshold = 0.1
mask_selection_fast = False

# Debug mask color (RGBA)
debug_mask_color = 108,30,240,127


[Denoiser]

# Denoising disabled by default
denoising_enabled = False

# Maximum threads for denoising (0 = auto = all cores)
max_threads = 0

# Noise thresholds
noise_min_standard_deviation = 0.25
noise_outline_size = 5
noise_fade_radius = 1

# Denoising filter settings
colored_images = True
filter_strength = 10
color_filter_strength = 10
template_window_size = 7
search_window_size = 21


[Inpainter]

# Inpainting model name (options: anime-manga-big-lama, big-lama, anime-manga-inpainting, anime-big-lama-hf, lama-manga)
inpainting_model_name = anime-manga-big-lama

# Custom model path (leave empty for auto-download)
custom_inpainting_model_path =

# Enable inpainting for masks that couldn't be cleaned well
inpainting_enabled = True

# Inpainting quality thresholds
inpainting_min_std_dev = 3.0
inpainting_max_mask_radius = 6
min_inpainting_radius = 10
inpainting_radius_multiplier = 0.2
max_inpainting_radius = 20

# Inpainting isolation and blending
inpainting_isolation_radius = 8
inpainting_fade_radius = 4
