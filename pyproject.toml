[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=75.0", "wheel"]

[project]
name = "pcleaner"
dynamic = ["version"]
description = "An AI-powered tool to clean manga panels."
readme = {file = "README.md", content-type = "text/markdown; charset=UTF-8; variant=GFM"}
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["image processing", "cleaning", "text removal", "manga", "ai", "machine learning"]
authors = [
    {name = "VoxelCubes", email = "voxelcubes@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
]

# =============================================================================
# CORE dependencies – required for all CLI operations
# =============================================================================
dependencies = [
    # Image processing (core)
    "opencv-python>=4.11.0,<5",
    "numpy>=2.4.6,<3",
    "pillow>=12.2.0,<13",
    "scipy>=1.17.1,<2",
    "shapely>=2.1.2,<3",
    "pyclipper>=1.3.0.post5,<2",
    "psd-tools>=1.11.0,<2",
    "tifffile>=2024.9.0,<2025",
    # CLI & utilities
    "natsort>=8.4.0,<9",
    "tqdm>=4.67.0,<5",
    "loguru>=0.7.3,<1",
    "prettytable>=3.12.0,<4",
    "colorama>=0.4.6,<1",
    "requests>=2.32.0,<3",
    "xdg>=6.0.0,<7",
    "attrs>=24.0.0,<26",
    "psutil>=6.1.0,<7",
    "dictdiffer>=0.9.0,<1",
    "humanfriendly>=10.0,<12",
    "packaging>=25.0,<26",
    "pyyaml>=6.0.2,<7",
    "regex>=2024.11.0,<2026",
    "filelock>=3.16.0,<4",
    "docopt-ng>=0.9.0,<1",
    "configupdater>=3.2.0,<4",
    # Backport shims (stdlib since 3.11/3.12)
    "importlib-metadata>=8.0.0; python_version<'3.12'",
    "strenum>=0.4.15; python_version<'3.11'",
    # Windows-only
    "pywin32>=310; platform_system=='Windows'",
    "win10toast>=0.9; platform_system=='Windows'",
    "pyuac>=0.0.2; platform_system=='Windows'",
]

[project.optional-dependencies]
# ── GUI ──────────────────────────────────────────────────────────────────────
gui = [
    "PySide6>=6.11.1",
]

# ── Server / API ─────────────────────────────────────────────────────────────
server = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.1",
    "supabase>=2.9.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "python-dotenv>=1.1.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.18",
]

# ── OCR ──────────────────────────────────────────────────────────────────────
ocr = [
    "manga-ocr>=0.1.11",
    "pytesseract>=0.3.10",
    "fugashi>=1.5.2",
    "jaconv>=0.3.4",
    "unidic-lite>=1.0.8",
    "transformers>=4.47.0",
    "huggingface-hub>=0.27.0",
    "safetensors>=0.5.0",
    "tokenizers>=0.21.0",
]

# ── OCR advanced (optional engines) ──────────────────────────────────────────
ocr-extra = [
    "easyocr>=1.7.1",
]

# ── PaddlePaddle stack (completely optional, separate from core) ─────────────
paddle = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
]

# ── GPU acceleration (torch with CUDA) ───────────────────────────────────────
gpu = [
    "torch>=2.12.0",
    "torchvision>=0.22.0",
]

# ── Inpainting ───────────────────────────────────────────────────────────────
inpaint = [
]

# ── All-in-one (everything except paddle) ────────────────────────────────────
full = [
    "pcleaner[gui,server,ocr,ocr-extra,gpu,inpaint]",
]

# ── Everything including paddle ──────────────────────────────────────────────
all = [
    "pcleaner[gui,server,ocr,ocr-extra,gpu,inpaint,paddle]",
]

[project.scripts]
pcleaner = "pcleaner.main:main"
pcleaner-cli = "pcleaner.main:main"
pcleaner-gui = "pcleaner.gui.launcher:main"

[project.urls]
Homepage = "https://github.com/VoxelCubes/PanelCleaner"
Repository = "https://github.com/VoxelCubes/PanelCleaner"

[tool.setuptools.dynamic]
version = {attr = "pcleaner.__version__"}

[tool.setuptools.packages.find]
include = ["pcleaner*", "server*"]
exclude = ["tests*", "_testbed*"]

[tool.setuptools.package-data]
pcleaner = [
    "data/*",
    "data/color_themes/**/*",
    "data/custom_icons/**/*",
    "data/theme_icons/**/*",
    "data/translation_generated_files/**/*",
    "models/**/*",
]

[tool.black]
line-length = 100
