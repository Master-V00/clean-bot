[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=75.0", "wheel"]

[project]
name = "panelcleaner-server"
version = "2.0.0"
description = "AI-powered manga panel cleaning server"
requires-python = ">=3.10"

dependencies = [
    # Image processing (core)
    "opencv-python>=4.11.0,<5",
    "numpy>=2.4.6,<3",
    "pillow>=12.2.0,<13",
    "scipy>=1.17.1,<2",
    "shapely>=2.1.2,<3",
    "pyclipper>=1.3.0.post5,<2",
    "psd-tools>=1.11.0,<2",
    "tifffile>=2024.9.0,<2025",
    # Utilities
    "loguru>=0.7.3,<1",
    "requests>=2.32.0,<3",
    "attrs>=24.0.0,<26",
    "psutil>=6.1.0,<7",
    "packaging>=25.0,<26",
    "pyyaml>=6.0.2,<7",
    "configupdater>=3.2.0,<4",
    "pywin32>=310; platform_system=='Windows'",
    # Server / API
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.1",
    "supabase>=2.9.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "python-dotenv>=1.1.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
